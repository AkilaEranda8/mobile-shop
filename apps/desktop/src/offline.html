<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexalyte — Offline</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #2563eb;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 22px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 10px 18px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .hint {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">H</div>
    <h1>Cannot reach Hexalyte</h1>
    <p>Check your internet connection, then try again. The desktop app needs access to the Hexalyte cloud.</p>
    <button type="button" id="retry">Try again</button>
    <div class="hint" id="url"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    const target = params.get('url') || 'https://app.hexalyte.com/login'
    document.getElementById('url').textContent = target
    document.getElementById('retry').addEventListener('click', () => {
      location.href = target
    })
  </script>
</body>
</html>
