# Hexalyte PostgreSQL host-based auth (production hardening)
# Docker network ranges only — reject everything else.
# Loaded via: postgres -c hba_file=/etc/hexalyte/pg_hba.conf

# TYPE  DATABASE        USER            ADDRESS                 METHOD
# Socket inside the container only (docker exec) — not reachable from the host network
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
# Docker bridge / compose networks (typical private ranges)
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256
# Explicit deny (defense in depth)
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
